<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FinFlow Goal Category Icons</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f1fbf7; color: #05201b; font-family: Arial, sans-serif; }
    main { width: 1000px; padding: 42px 46px 52px; }
    h1 { margin: 0; color: #006c53; font-size: 34px; }
    .subtitle { margin: 8px 0 30px; color: #60736f; font-size: 17px; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .card { min-height: 142px; padding: 18px 12px; background: white; border: 1px solid #d6e7e0; border-radius: 18px; box-shadow: 0 2px 4px #00523c18, 0 7px 18px #00523c20; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .icon-wrap { width: 62px; height: 62px; border-radius: 50%; background: color-mix(in srgb, var(--color) 13%, white); color: var(--color); display: grid; place-items: center; margin-bottom: 12px; }
    .icon-wrap svg { width: 34px; height: 34px; color: inherit; }
    .label { font-size: 15px; font-weight: 700; text-align: center; }
  </style>
</head>
<body>
<main>
  <h1>FinFlow · Goal Categories</h1>
  <div class="subtitle">Phosphor Duotone · 14 goal-specific categories</div>
  <section class="grid">
    <div class="card" style="--color:#d84d4d"><div class="icon-wrap" data-src="goals/emergency_fund.svg"></div><div class="label">Emergency Fund</div></div>
    <div class="card" style="--color:#e05252"><div class="icon-wrap" data-src="goals/home.svg"></div><div class="label">Home</div></div>
    <div class="card" style="--color:#d97706"><div class="icon-wrap" data-src="goals/vehicle.svg"></div><div class="label">Vehicle</div></div>
    <div class="card" style="--color:#2878b5"><div class="icon-wrap" data-src="goals/travel.svg"></div><div class="label">Travel</div></div>
    <div class="card" style="--color:#4267b2"><div class="icon-wrap" data-src="goals/education.svg"></div><div class="label">Education</div></div>
    <div class="card" style="--color:#6750a4"><div class="icon-wrap" data-src="goals/technology.svg"></div><div class="label">Technology</div></div>
    <div class="card" style="--color:#c54886"><div class="icon-wrap" data-src="goals/wedding.svg"></div><div class="label">Wedding</div></div>
    <div class="card" style="--color:#168a83"><div class="icon-wrap" data-src="goals/family.svg"></div><div class="label">Family</div></div>
    <div class="card" style="--color:#159a7d"><div class="icon-wrap" data-src="goals/health.svg"></div><div class="label">Health</div></div>
    <div class="card" style="--color:#8a6642"><div class="icon-wrap" data-src="goals/business.svg"></div><div class="label">Business</div></div>
    <div class="card" style="--color:#087a5a"><div class="icon-wrap" data-src="goals/investment.svg"></div><div class="label">Investment</div></div>
    <div class="card" style="--color:#d49600"><div class="icon-wrap" data-src="goals/retirement.svg"></div><div class="label">Retirement</div></div>
    <div class="card" style="--color:#cf4f75"><div class="icon-wrap" data-src="goals/shopping.svg"></div><div class="label">Shopping</div></div>
    <div class="card" style="--color:#7a8580"><div class="icon-wrap" data-src="goals/other_goal.svg"></div><div class="label">Other Goal</div></div>
  </section>
</main>
<script>
  Promise.all([...document.querySelectorAll('[data-src]')].map(async (node) => {
    node.innerHTML = await fetch(node.dataset.src).then((response) => response.text());
  })).then(() => { document.body.dataset.ready = 'true'; });
</script>
</body>
</html>
